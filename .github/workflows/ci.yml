name: CI

# action 版本对齐 Node 24 运行时（issue #29）：GitHub 已弃用 Node 20，
# 未迁移的 action 会在弃用完成后直接失败。升级时四个 workflow 一起改，
# 避免同一个 action 在不同文件里版本漂移。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build / test / vet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: test (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1

      - name: landing page contrast
        run: node docs/landing/check-contrast.mjs

      - name: frontend tests
        shell: bash
        run: |
          # 前端纯逻辑测试。布局：tests/frontend/（与 Go 的 internal/* 对称，
          # 一处放全部前端测试）。计划文档里的 frontend/test/ 是旧口径，
          # 已统一到 tests/frontend/。
          # bash 的 glob 在无匹配时会原样传字面量，node 会把它当成文件名
          # 去读然后报错 —— 所以先展开成数组、空数组就明确跳过。
          shopt -s nullglob
          specs=(tests/frontend/*.test.mjs)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "no frontend specs yet — skipping"
            exit 0
          fi
          node --test "${specs[@]}"
