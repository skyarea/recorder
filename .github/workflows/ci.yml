name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build / test / vet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: test (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1

      - name: landing page contrast
        run: node docs/landing/check-contrast.mjs

      - name: frontend tests
        shell: bash
        run: |
          # 前端纯逻辑测试在 Task 8（UI 落地）之前还不存在。bash 的 glob 在
          # 无匹配时会原样传字面量，node 会把它当成文件名去读然后报错 ——
          # 所以先展开成数组、空数组就明确跳过，而不是让这一步红灯。
          shopt -s nullglob
          specs=(tests/frontend/*.test.mjs)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "no frontend specs yet — skipping"
            exit 0
          fi
          node --test "${specs[@]}"
