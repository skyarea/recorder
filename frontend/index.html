<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PDF 阅读进度 · 笔记</title>
  <style>
    body {
      font-family: system-ui, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f5f4;
      color: #1c1917;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid #e7e5e4;
    }
    header h1 { font-size: 16px; margin: 0; }
    header .stats { color: #78716c; font-size: 13px; margin-left: auto; }
    button {
      font: inherit;
      padding: 4px 14px;
      border: 1px solid #a8a29e;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #f5f5f4; }
    main { flex: 1; display: flex; min-height: 0; }
    .list-pane {
      width: 380px;
      padding: 20px;
      overflow: auto;
      border-right: 1px solid #e7e5e4;
      background: #fff;
    }
    .empty { text-align: center; color: #57534e; margin-top: 15vh; }
    .empty p { margin: 6px 0 16px; }
    ul.files { list-style: none; margin: 0; padding: 0; }
    ul.files li {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #e7e5e4;
      background: #fff;
      cursor: pointer;
    }
    ul.files li:hover { background: #f5f5f4; }
    ul.files li.selected { background: #eef2ff; }
    .name { flex: 1; word-break: break-all; }
    .status { font-size: 12px; color: #78716c; }
    .status.reading { color: #2563eb; }
    .status.done { color: #16a34a; }
    .status.skip { color: #a8a29e; }
    .page { font-size: 12px; color: #78716c; min-width: 64px; text-align: right; }
    .star { color: #f59e0b; }
    .warn { color: #b45309; font-size: 13px; margin-top: 12px; }
    .reader { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .reader[hidden] { display: none; }
    .reader-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #fff;
      border-bottom: 1px solid #e7e5e4;
      font-size: 13px;
    }
    .reader-bar .doc { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reader-bar .pager { color: #78716c; margin-left: auto; }
    .reader-bar input {
      font: inherit;
      width: 64px;
      padding: 2px 6px;
      border: 1px solid #a8a29e;
      border-radius: 6px;
    }
    #viewer { flex: 1; width: 100%; border: 0; background: #525659; }
  </style>
</head>
<body>
  <header>
    <h1 id="root-name">PDF 阅读进度 · 笔记</h1>
    <button id="pick">选择目录</button>
    <span class="stats" id="stats"></span>
  </header>
  <main>
    <section class="list-pane">
      <div id="empty" class="empty" hidden>
        <p id="empty-msg">尚未选择根目录。</p>
        <button id="pick2">选择根目录</button>
      </div>
      <ul class="files" id="files"></ul>
      <p class="warn" id="warn" hidden></p>
    </section>
    <section class="reader" id="reader" hidden>
      <div class="reader-bar">
        <span class="doc" id="doc-name"></span>
        <span class="pager" id="pager"></span>
        <input id="goto-page" type="number" min="1" step="1" aria-label="页码" />
        <button id="goto-btn">跳转</button>
        <button id="close-reader">关闭</button>
      </div>
      <iframe id="viewer" title="PDF 阅读区"></iframe>
    </section>
  </main>
  <script type="module">
    import { Msg, VIEWER_SRC, listener, postToViewer } from "./lib/bridge.mjs";

    const STATUS = { todo: "待读", reading: "在读", done: "读完", skip: "跳过" };

    async function api(path, body) {
      const resp = await fetch(path, body === undefined ? undefined
        : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || resp.statusText);
      return data;
    }

    function render(st) {
      document.getElementById("root-name").textContent =
        st.rootName || "PDF 阅读进度 · 笔记";
      const list = document.getElementById("files");
      list.replaceChildren(...st.scanned.map((f) => {
        const rec = st.records[f.path] || { status: "todo", page: 0, starred: false };
        const li = document.createElement("li");
        li.dataset.path = f.path;
        li.tabIndex = 0;
        li.onclick = () => openDoc(f.path);
        li.onkeydown = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openDoc(f.path);
          }
        };
        if (rec.starred) {
          const s = document.createElement("span");
          s.className = "star";
          s.textContent = "★";
          li.append(s);
        }
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = f.path;
        const status = document.createElement("span");
        status.className = "status " + rec.status;
        status.textContent = STATUS[rec.status] || rec.status;
        const page = document.createElement("span");
        page.className = "page";
        page.textContent = rec.totalPages ? `${rec.page}/${rec.totalPages}` : `${rec.page}`;
        li.append(name, status, page);
        return li;
      }));
      markSelected();

      const done = Object.values(st.records).filter((r) => r.status === "done").length;
      document.getElementById("stats").textContent =
        `${st.scanned.length} 个文件 · 读完 ${done}`;

      const empty = document.getElementById("empty");
      empty.hidden = st.hasRoot;
      document.getElementById("empty-msg").textContent = st.rootPath && !st.hasRoot
        ? `根目录不存在：${st.rootPath}，请重新选择。`
        : "尚未选择根目录。";

      const warn = document.getElementById("warn");
      warn.hidden = st.orphanCount === 0;
      warn.textContent = `有 ${st.orphanCount} 条记录不在当前目录树中（孤儿），导入/导出可迁移。`;
    }

    // --- reader ---------------------------------------------------------------

    // The document open in the reader, as a root-relative path.
    let current = null;
    let docPages = 0;
    let curPage = 1;
    // The viewer only accepts a goto once its bridge has reported ready; until
    // then the frame has no listener, so remember the page instead.
    let viewerReady = false;
    let wantedPage = 0;
    const viewer = document.getElementById("viewer");

    function markSelected() {
      for (const li of document.getElementById("files").children) {
        li.classList.toggle("selected", li.dataset.path === current);
      }
    }

    // Each segment is encoded on its own so '/' keeps naming the path that
    // /files/* will decode back into a root-relative document.
    function filesURL(rel) {
      return "/files/" + rel.split("/").map(encodeURIComponent).join("/");
    }

    function renderPager() {
      document.getElementById("pager").textContent =
        docPages ? `第 ${curPage} / ${docPages} 页` : "载入中…";
      document.getElementById("goto-page").max = docPages || "";
    }

    function resetReaderState() {
      docPages = 0;
      curPage = 1;
      viewerReady = false;
      wantedPage = 0;
    }

    function openDoc(rel) {
      if (rel === current) return;
      current = rel;
      resetReaderState();
      document.getElementById("doc-name").textContent = rel;
      renderPager();
      document.getElementById("reader").hidden = false;
      markSelected();
      // Navigating the frame to a new URL gives a whole new viewer document:
      // that is what stops thumbnails, outline, find results and scroll
      // position carrying over from the previous file.
      viewer.src =
        "/vendor/pdfjs/web/viewer.html?file=" + encodeURIComponent(filesURL(rel));
    }

    function closeReader() {
      current = null;
      resetReaderState();
      document.getElementById("reader").hidden = true;
      // Drop the document, not only the pane: a hidden frame would keep the
      // old PDF and its state alive until the next open. Taking the attribute
      // away leaves a live frame alone, so navigate it away instead.
      viewer.src = "about:blank";
      markSelected();
    }

    window.addEventListener("message", listener(VIEWER_SRC, (m) => {
      if (m.type === Msg.Ready) {
        viewerReady = true;
        if (wantedPage) {
          postToViewer(viewer, Msg.Goto, { page: wantedPage });
          wantedPage = 0;
        }
        return;
      }
      // The bridge always says ready before it reports any page, so a message
      // from a frame that has not is the previous document still winding down.
      if (!viewerReady) return;
      if (m.type === Msg.Pages) {
        docPages = m.total || 0;
      } else if (m.type === Msg.Page) {
        curPage = m.page || 1;
      } else {
        return;
      }
      renderPager();
    }));

    function gotoPage() {
      const page = Number.parseInt(document.getElementById("goto-page").value, 10);
      if (!Number.isInteger(page) || page < 1) return;
      if (viewerReady) {
        postToViewer(viewer, Msg.Goto, { page });
      } else {
        wantedPage = page;
      }
    }

    document.getElementById("goto-btn").onclick = gotoPage;
    document.getElementById("goto-page").addEventListener("keydown", (e) => {
      if (e.key === "Enter") gotoPage();
    });
    document.getElementById("close-reader").onclick = closeReader;

    async function refresh() {
      render(await api("/api/state"));
    }

    async function pickRoot() {
      try {
        // The open document belongs to the old library.
        closeReader();
        render(await api("/api/root", {}));
      } catch (e) {
        alert(e.message);
      }
    }

    document.getElementById("pick").onclick = pickRoot;
    document.getElementById("pick2").onclick = pickRoot;
    refresh().catch((e) => {
      document.getElementById("empty-msg").textContent = "本地服务未就绪：" + e.message;
      document.getElementById("empty").hidden = false;
    });
  </script>
</body>
</html>
