<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>PDF 阅读进度 · 笔记</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#eef4ff; --hover:#f3f4f6;
    --radius:8px; --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b1220; --panel:#111a2b; --border:#25324a; --text:#e6eaf2; --muted:#8b98ad;
      --accent:#60a5fa; --accent-soft:#16233c; --hover:#182236;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  /* An explicit choice outranks the system preference, so the two blocks
     above are the default and this one is the override. */
  html[data-theme="light"]{
    --bg:#f5f6f8; --panel:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#eef4ff; --hover:#f3f4f6;
    --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  html[data-theme="dark"]{
    --bg:#0b1220; --panel:#111a2b; --border:#25324a; --text:#e6eaf2; --muted:#8b98ad;
    --accent:#60a5fa; --accent-soft:#16233c; --hover:#182236;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; overflow:hidden;
  }
  button,input,textarea{font:inherit;color:inherit}
  .hidden{display:none !important}
  kbd{
    background:var(--hover); border:1px solid var(--border); border-radius:4px;
    padding:1px 6px; font-size:12px; font-family:ui-monospace,monospace;
  }

  #topbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border:1px solid var(--border); background:var(--panel);
    border-radius:var(--radius); cursor:pointer; white-space:nowrap;
    transition:.15s; user-select:none;
  }
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.sm{padding:3px 9px; font-size:12.5px}
  .btn.link{border:none;background:none;color:var(--accent);padding:2px 4px;text-decoration:underline}
  .root-name{font-weight:600; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .root-name:empty{display:none}
  .spacer{flex:1}
  .search{
    width:200px; padding:6px 10px; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg); outline:none;
  }
  .search:focus{border-color:var(--accent); background:var(--panel)}

  .stats{display:flex; gap:4px; flex-wrap:wrap}
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px; border-radius:99px; border:1px solid var(--border);
    background:var(--panel); cursor:pointer; font-size:12.5px; transition:.15s;
  }
  .chip:hover{background:var(--hover)}
  .chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600}
  .chip b{font-weight:600}
  .chip i{width:7px;height:7px;border-radius:50%;display:inline-block}

  #notice{
    flex:0 0 auto; padding:6px 14px; font-size:13px;
    background:#fef3c7; color:#92400e; border-bottom:1px solid #fde68a;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  html[data-theme="dark"] #notice{background:#3a2c0a; color:#fcd34d; border-color:#5a4410}
  @media (prefers-color-scheme:dark){
    html:not([data-theme]) #notice{background:#3a2c0a; color:#fcd34d; border-color:#5a4410}
  }

  main{flex:1; display:flex; overflow:hidden}
  #sidebar{
    width:300px; flex:0 0 300px; overflow:auto; background:var(--panel);
    border-right:1px solid var(--border); padding:8px 6px 40px;
  }
  #detail{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden}

  .node{
    display:flex; align-items:center; gap:6px;
    padding:3px 8px; border-radius:6px; cursor:pointer;
    white-space:nowrap; overflow:hidden; font-size:13.5px;
  }
  .node:hover{background:var(--hover)}
  .node .nm{overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
  .node.dir{font-weight:600; color:var(--muted)}
  .node.file.active{background:var(--accent-soft); color:var(--accent); font-weight:600}
  .node .tw{width:12px; text-align:center; font-size:10px; color:var(--muted); flex:0 0 12px}
  .node .dot{flex:0 0 auto; font-size:11px; line-height:1}
  .node .star{color:#f59e0b; font-size:11px}
  .empty{padding:30px 16px; color:var(--muted); text-align:center; font-size:13.5px; line-height:1.9}

  .reader-top{
    flex:0 0 auto; padding:8px 14px 10px; background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .rt-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .rt-row + .rt-row{margin-top:7px}
  .d-path{font-size:14px; font-weight:600; word-break:break-all; flex:1; min-width:0}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .star-btn{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--border); background:var(--panel); cursor:pointer;
    font-size:15px; line-height:1; color:var(--muted); transition:.15s;
  }
  .star-btn:hover{background:var(--hover)}
  .star-btn.on{color:#f59e0b; border-color:#f59e0b}

  .stbtn{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 10px; border-radius:99px; border:1px solid var(--border);
    background:var(--panel); cursor:pointer; transition:.15s; font-size:12.5px;
  }
  .stbtn:hover{background:var(--hover)}
  .stbtn .dot{color:var(--c)}
  .stbtn.on{border-color:var(--c); background:var(--accent-soft); font-weight:600}
  .stbtn kbd{
    font-size:10px; opacity:.4; border:1px solid currentColor; border-radius:3px;
    padding:0 3px; font-family:ui-monospace,monospace; background:none;
  }
  .tbtn{
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 10px; border-radius:99px; border:1px solid var(--border);
    background:var(--panel); cursor:pointer; transition:.15s; font-size:12.5px;
  }
  .tbtn:hover{background:var(--hover)}
  .tbtn.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600}
  .page-row{display:inline-flex; align-items:center; gap:5px; font-size:13px}
  .page-row input{
    width:64px; padding:3px 7px; border:1px solid var(--border);
    border-radius:6px; background:var(--bg); outline:none;
  }
  .pct{font-size:12.5px; color:var(--muted)}
  .mini-bar{width:80px;height:5px;border-radius:99px;background:var(--hover);overflow:hidden}
  .mini-bar i{display:block;height:100%;background:var(--accent)}

  #pdfWrap{flex:1; min-height:0; position:relative; background:#525659}
  #viewer{width:100%; height:100%; border:0; display:block}

  .notes-panel{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--border);
    display:flex; flex-direction:column; max-height:45%;
  }
  .notes-panel:not(.open) .notes-inner{display:none}
  .notes-bar{
    display:flex; align-items:center; gap:8px; padding:7px 14px;
    cursor:pointer; user-select:none; font-size:13.5px; font-weight:600;
  }
  .notes-bar:hover{background:var(--hover)}
  .notes-bar .count{
    font-size:11.5px; background:var(--accent-soft); color:var(--accent);
    border-radius:99px; padding:0 7px; font-weight:600;
  }
  .notes-inner{display:flex; flex-direction:column; min-height:0; overflow:auto; padding:0 14px 12px}
  .notes-list{display:flex; flex-direction:column; gap:8px}
  .note{
    border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 10px; background:var(--bg); font-size:13.5px;
  }
  .note-meta{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; margin-bottom:4px; flex-wrap:wrap}
  .note-page{background:var(--accent-soft); color:var(--accent); border-radius:4px; padding:0 5px}
  /* #14: the badges naming the shapes a note hangs on; clicking one jumps
     the reader to that shape and blinks it. */
  .note-badges{display:flex; gap:4px; flex-wrap:wrap}
  .ann-badge{
    display:inline-flex; align-items:center; gap:3px;
    background:var(--accent-soft); color:var(--accent); border:1px solid transparent;
    border-radius:99px; padding:0 8px; font-size:11.5px; cursor:pointer; transition:.15s;
  }
  .ann-badge:hover{border-color:var(--accent)}
  .note-body.jumpable{cursor:pointer}
  .note-body.jumpable:hover{text-decoration:underline dotted}
  /* the "挂标注" picker */
  .link-picker{
    margin-top:6px; padding:6px 8px; border:1px dashed var(--border);
    border-radius:var(--radius); background:var(--panel); font-size:12.5px;
  }
  .link-row{display:flex; align-items:center; gap:8px; padding:2px 0}
  .link-row span:first-child{flex:1; min-width:0}
  .link-refs{margin-left:8px; color:var(--muted); font-size:11.5px}
  .note-body p{margin:4px 0}
  .note-body h3,.note-body h4,.note-body h5,.note-body h6{margin:8px 0 4px}
  .note-body ul{margin:4px 0; padding-left:20px}
  .note-body blockquote{margin:4px 0; padding-left:10px; border-left:3px solid var(--border); color:var(--muted)}
  .note-body code{background:var(--hover); border-radius:4px; padding:1px 5px; font-size:12.5px}
  .note-body a{color:var(--accent)}
  .note-actions{display:flex; gap:4px; margin-top:6px}
  .note-editor{display:flex; flex-direction:column; gap:6px; margin-top:10px}
  .note-editor textarea{
    min-height:64px; padding:8px 10px; border:1px solid var(--border);
    border-radius:var(--radius); background:var(--bg); outline:none; resize:vertical;
  }
  .note-editor textarea:focus{border-color:var(--accent)}
  .editor-foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:8px 16px; border-radius:99px;
    font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:10;
  }
  #toast.show{opacity:.95}
</style>
</head>
<body>

<header id="topbar">
  <button class="btn primary" id="pick">选择目录</button>
  <span id="rootName" class="root-name"></span>
  <div id="stats" class="stats"></div>
  <div class="spacer"></div>
  <input id="search" class="search" type="search" placeholder="搜索文件 / 笔记…  ( / )" />
  <button class="btn" id="theme-btn" title="切换深色 / 浅色">🌗</button>
  <button class="btn" id="export-btn">导出</button>
  <label class="btn">导入<input type="file" id="import-input" accept=".json,application/json" hidden></label>
</header>

<div id="notice" class="hidden"></div>

<main>
  <aside id="sidebar"><div id="tree"></div></aside>
  <section id="detail"></section>
</main>

<div id="toast"></div>

<script type="module" src="./app.mjs"></script>
</body>
</html>
