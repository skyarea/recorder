<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 阅读进度 · 笔记</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#eef4ff; --hover:#f3f4f6;
    --radius:8px; --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b1220; --panel:#111a2b; --border:#25324a; --text:#e6eaf2; --muted:#8b98ad;
      --accent:#60a5fa; --accent-soft:#16233c; --hover:#182236;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; overflow:hidden;
  }
  button,input,textarea{font:inherit;color:inherit}
  .hidden{display:none !important}

  /* ---------- 顶栏 ---------- */
  #topbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border:1px solid var(--border); background:var(--panel);
    border-radius:var(--radius); cursor:pointer; white-space:nowrap;
    transition:.15s; user-select:none;
  }
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.sm{padding:3px 9px; font-size:12.5px}
  .btn.link{border:none;background:none;color:var(--accent);padding:2px 4px;text-decoration:underline}
  .root-name{font-weight:600; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .root-name:empty{display:none}
  .spacer{flex:1}
  .search{
    width:200px; padding:6px 10px; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg); outline:none;
  }
  .search:focus{border-color:var(--accent); background:var(--panel)}

  .stats{display:flex; gap:4px; flex-wrap:wrap}
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px; border-radius:99px; border:1px solid var(--border);
    background:var(--panel); cursor:pointer; font-size:12.5px; transition:.15s;
  }
  .chip:hover{background:var(--hover)}
  .chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600}
  .chip b{font-weight:600}
  .chip i{width:7px;height:7px;border-radius:50%;display:inline-block}

  #notice{
    flex:0 0 auto; padding:6px 14px; font-size:13px;
    background:#fef3c7; color:#92400e; border-bottom:1px solid #fde68a;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  @media (prefers-color-scheme:dark){
    #notice{background:#3a2c0a; color:#fcd34d; border-color:#5a4410}
  }

  /* ---------- 主体 ---------- */
  main{flex:1; display:flex; overflow:hidden}
  #sidebar{
    width:300px; flex:0 0 300px; overflow:auto; background:var(--panel);
    border-right:1px solid var(--border); padding:8px 6px 40px;
  }
  #detail{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden}

  /* ---------- 树 ---------- */
  .node{
    display:flex; align-items:center; gap:6px;
    padding:3px 8px; border-radius:6px; cursor:pointer;
    white-space:nowrap; overflow:hidden; font-size:13.5px;
  }
  .node:hover{background:var(--hover)}
  .node .nm{overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
  .node.dir{font-weight:600; color:var(--muted)}
  .node.file.active{background:var(--accent-soft); color:var(--accent); font-weight:600}
  .node .tw{width:12px; text-align:center; font-size:10px; color:var(--muted); flex:0 0 12px}
  .node .dot{flex:0 0 auto; font-size:11px; line-height:1}
  .node .star{color:#f59e0b; font-size:11px}
  .empty{padding:30px 16px; color:var(--muted); text-align:center; font-size:13.5px; line-height:1.9}
  .empty kbd{
    background:var(--hover); border:1px solid var(--border); border-radius:4px;
    padding:1px 6px; font-size:12px; font-family:ui-monospace,monospace;
  }

  /* ---------- 阅读器顶部工具条 ---------- */
  .reader-top{
    flex:0 0 auto; padding:8px 14px 10px; background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .rt-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .rt-row + .rt-row{margin-top:7px}
  .d-path{font-size:14px; font-weight:600; word-break:break-all; flex:1; min-width:0}
  .star{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--border); background:var(--panel); cursor:pointer;
    font-size:15px; line-height:1; color:var(--muted); transition:.15s;
  }
  .star:hover{background:var(--hover)}
  .star.on{color:#f59e0b; border-color:#f59e0b}

  .stbtn{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 10px; border-radius:99px; border:1px solid var(--border);
    background:var(--panel); cursor:pointer; transition:.15s; font-size:12.5px;
  }
  .stbtn:hover{background:var(--hover)}
  .stbtn .dot{color:var(--c)}
  .stbtn.on{border-color:var(--c); background:color-mix(in srgb, var(--c) 14%, transparent); font-weight:600}
  .stbtn kbd{
    font-size:10px; opacity:.4; border:1px solid currentColor; border-radius:3px;
    padding:0 3px; font-family:ui-monospace,monospace;
  }

  .page-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
  .page-row input{
    width:62px; padding:3px 7px; border:1px solid var(--border);
    border-radius:6px; background:var(--bg); outline:none; text-align:center;
  }
  .page-row input:focus{border-color:var(--accent); background:var(--panel)}
  .pct{font-weight:600; color:var(--accent); min-width:38px}
  .mini-bar{width:110px; height:6px; border-radius:99px; background:var(--hover); overflow:hidden}
  .mini-bar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s}

  /* ---------- PDF 区 ---------- */
  .pdf-wrap{flex:1; min-height:0; position:relative; background:#525659}
  .pdf-wrap iframe{width:100%; height:100%; border:0; display:block}
  .pdf-fallback{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; text-align:center;
    color:#e5e7eb; padding:24px; font-size:14px; line-height:1.9;
  }
  .pdf-fallback .small{font-size:12.5px; opacity:.7}
  .pdf-fallback .btn{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.3); color:#fff}
  .pdf-fallback .btn:hover{background:rgba(255,255,255,.2)}

  /* ---------- 笔记面板 ---------- */
  .notes-panel{
    flex:0 0 auto; display:flex; flex-direction:column;
    background:var(--panel); border-top:1px solid var(--border);
  }
  .notes-bar{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:7px 14px; cursor:pointer; user-select:none; font-size:13px; font-weight:600;
  }
  .notes-bar:hover{background:var(--hover)}
  .notes-bar .arrow{font-size:10px; color:var(--muted); width:12px}
  .notes-bar .count{
    font-size:11.5px; font-weight:500; background:var(--hover);
    border-radius:99px; padding:0 8px; color:var(--muted);
  }
  .notes-bar .sp{flex:1}
  .notes-inner{display:none}
  .notes-panel.open .notes-inner{
    display:flex; flex-direction:column; height:36vh; min-height:170px;
    border-top:1px solid var(--border);
  }
  .notes-list{flex:1; overflow:auto; padding:10px 14px 4px}
  .notes-list::-webkit-scrollbar{width:9px}
  .notes-list::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px}

  .muted{color:var(--muted)}
  .small{font-size:12.5px}

  .note{
    border:1px solid var(--border); border-radius:var(--radius);
    padding:8px 11px; margin-bottom:8px; background:var(--panel); box-shadow:var(--shadow);
  }
  .note-meta{
    display:flex; align-items:center; gap:8px; font-size:11.5px;
    color:var(--muted); margin-bottom:4px;
  }
  .note-meta .note-page{
    background:var(--accent-soft); color:var(--accent);
    padding:0 7px; border-radius:99px; font-weight:600;
  }
  .note-meta .sp{flex:1}
  .note-meta button{
    border:none; background:none; cursor:pointer; color:var(--muted);
    padding:0 3px; font-size:11.5px; border-radius:4px;
  }
  .note-meta button:hover{color:var(--accent); background:var(--hover)}
  .note-body{word-break:break-word; font-size:13.5px}
  .note-body p{margin:0 0 5px}
  .note-body p:last-child{margin-bottom:0}
  .note-body h3,.note-body h4,.note-body h5,.note-body h6{margin:5px 0 3px; line-height:1.4}
  .note-body ul{margin:3px 0; padding-left:20px}
  .note-body blockquote{
    margin:3px 0; padding:2px 10px; border-left:3px solid var(--border); color:var(--muted);
  }
  .note-body code{
    background:var(--hover); padding:1px 5px; border-radius:4px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:.9em;
  }
  .note-body a{color:var(--accent)}
  .note textarea{
    width:100%; min-height:64px; padding:7px; border:1px solid var(--accent);
    border-radius:6px; background:var(--bg); outline:none; resize:vertical;
    font-family:inherit; font-size:13.5px;
  }
  .note .edit-actions{display:flex; gap:6px; margin-top:5px}

  .note-editor{
    flex:0 0 auto; padding:8px 14px 12px; border-top:1px solid var(--border);
    background:var(--panel);
  }
  .note-editor textarea{
    width:100%; min-height:58px; padding:8px 10px;
    border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg); outline:none; resize:vertical;
    font-family:inherit; line-height:1.6; font-size:13.5px;
  }
  .note-editor textarea:focus{border-color:var(--accent); background:var(--panel)}
  .editor-foot{display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap}
  .editor-foot label{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px}
  .editor-foot input{
    width:62px; padding:3px 7px; border:1px solid var(--border);
    border-radius:6px; background:var(--bg); outline:none; text-align:center;
  }
  .editor-foot .sp{flex:1}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
    background:#111827; color:#fff; padding:9px 18px; border-radius:99px;
    font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:99;
    box-shadow:0 6px 24px rgba(0,0,0,.25); max-width:80vw;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  @media (prefers-color-scheme:dark){ .toast{background:#e5e9f0; color:#0b1220} }

  /* ---------- 窄屏 ---------- */
  @media (max-width:900px){
    main{flex-direction:column}
    #sidebar{width:100%; flex:0 0 34%; border-right:none; border-bottom:1px solid var(--border)}
    .search{width:100%}
    .stbtn kbd{display:none}
    .notes-panel.open .notes-inner{height:44vh}
  }
</style>
</head>
<body>

<header id="topbar">
  <label class="btn primary">
    选择资料文件夹
    <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
  </label>
  <span id="rootName" class="root-name"></span>
  <div id="stats" class="stats"></div>
  <div class="spacer"></div>
  <input id="search" class="search" type="search" placeholder="搜索文件 / 笔记…  ( / )">
  <button class="btn" id="exportBtn">导出</button>
  <label class="btn">导入<input type="file" id="importInput" accept=".json,application/json" hidden></label>
</header>

<div id="notice" class="hidden"></div>

<main>
  <aside id="sidebar"><div id="tree"></div></aside>
  <section id="detail"></section>
</main>

<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';

/* ============================== 常量 & 状态 ============================== */

const LS_KEY = 'pdf-reader-tracker.v1';
const LS_UI  = 'pdf-reader-tracker.ui.v1';

const STATUS = {
  todo:    {label:'未读', color:'#94a3b8', dot:'○'},
  reading: {label:'在读', color:'#3b82f6', dot:'◐'},
  done:    {label:'已读', color:'#22c55e', dot:'●'},
  skip:    {label:'跳过', color:'#d6d3d1', dot:'—'}
};
const STATUS_KEYS = ['todo','reading','done','skip'];

let store = {version:1, rootName:'', files:{}};
let ui    = {collapsed:[], filter:'all', notesOpen:true};
let scanned   = [];        // [{path, name}]
let fileMap   = new Map(); // path -> File（刷新后失效，需重新选文件夹）
let currentPath = null;
let query = '';
let editingNoteId = null;
let currentBlobUrl = null;

/* ============================== 工具 ============================== */

const $ = s => document.querySelector(s);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtTime(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ============================== 持久化 ============================== */

function loadAll(){
  try{
    const a = localStorage.getItem(LS_KEY);
    if(a){
      const o = JSON.parse(a);
      if(o && typeof o === 'object' && o.files && typeof o.files === 'object'){
        store = {version:1, rootName:o.rootName||'', files:o.files};
      }
    }
  }catch(e){ console.warn('读取本地数据失败', e); }

  try{
    const b = localStorage.getItem(LS_UI);
    if(b){
      const o = JSON.parse(b);
      if(o && typeof o === 'object'){
        if(Array.isArray(o.collapsed)) ui.collapsed = o.collapsed;
        if(typeof o.filter === 'string') ui.filter = o.filter;
        if(typeof o.notesOpen === 'boolean') ui.notesOpen = o.notesOpen;
      }
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  catch(e){ toast('⚠ 本地保存失败：' + e.message); }
}
function saveUI(){
  try{ localStorage.setItem(LS_UI, JSON.stringify(ui)); }catch(e){}
}

/* ============================== 记录 ============================== */

function getRec(path){
  const r = store.files[path];
  if(!r) return {status:'todo', page:0, totalPages:0, starred:false, notes:[]};
  if(!Array.isArray(r.notes)) r.notes = [];
  if(typeof r.page !== 'number') r.page = 0;
  if(typeof r.totalPages !== 'number') r.totalPages = 0;
  if(!STATUS[r.status]) r.status = 'todo';
  return r;
}
function ensureRec(path){
  let r = store.files[path];
  if(!r){
    r = {status:'todo', page:0, totalPages:0, starred:false, notes:[], updatedAt:''};
    store.files[path] = r;
  }
  if(!Array.isArray(r.notes)) r.notes = [];
  return r;
}

/* ============================== 扫描 ============================== */

function handleScan(fileList){
  const arr = Array.from(fileList).filter(f => /\.pdf$/i.test(f.name || ''));
  if(!arr.length){ toast('这个文件夹里没有找到 PDF'); return; }

  const map = new Map();
  const fm  = new Map();
  for(const f of arr){
    let p = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
    if(!map.has(p)){ map.set(p, {path:p, name:f.name}); fm.set(p, f); }
  }
  scanned = Array.from(map.values())
    .sort((a,b) => a.path.localeCompare(b.path, 'zh', {numeric:true}));
  fileMap = fm;

  const first = scanned[0].path;
  store.rootName = first.includes('/') ? first.split('/')[0] : '(单文件)';
  save();

  if(!scanned.some(f => f.path === currentPath)) currentPath = null;
  if(!currentPath) currentPath = scanned[0].path;

  renderAll();
  if(currentPath) autoPageCount(currentPath);
  toast('已载入 ' + scanned.length + ' 个 PDF');
}

/* ============================== 总页数探测（尽力而为） ============================== */

function sniffPageCount(file){
  return new Promise(resolve=>{
    try{
      const HEAD = Math.min(file.size, 2*1024*1024);
      const TAIL = Math.min(Math.max(file.size - HEAD, 0), 1024*1024);
      const parts = [file.slice(0, HEAD)];
      if(TAIL > 0) parts.push(file.slice(file.size - TAIL));

      Promise.all(parts.map(p => p.arrayBuffer())).then(bufs=>{
        let txt = '';
        for(const b of bufs) txt += new TextDecoder('latin1').decode(new Uint8Array(b));
        let max = 0, m;
        const re = /\/Count\s+(\d+)/g;
        while((m = re.exec(txt))){
          const n = parseInt(m[1],10);
          if(n > max && n < 200000) max = n;
        }
        resolve(max);
      }).catch(()=>resolve(0));
    }catch(e){ resolve(0); }
  });
}

async function autoPageCount(path){
  const rec = store.files[path];
  if(rec && rec.totalPages > 0) return;
  const f = fileMap.get(path);
  if(!f) return;
  const n = await sniffPageCount(f);
  if(n > 0){
    const r = ensureRec(path);
    if(!r.totalPages){
      r.totalPages = n;
      save();
      if(path === currentPath) refreshPageUI();
    }
  }
}

/* ============================== 筛选 / 树 ============================== */

function match(path){
  const r = getRec(path);
  if(ui.filter === 'star'){
    if(!r.starred) return false;
  }else if(ui.filter !== 'all'){
    if((r.status || 'todo') !== ui.filter) return false;
  }
  if(query){
    const q = query.toLowerCase();
    if(path.toLowerCase().includes(q)) return true;
    if((r.notes || []).some(n => String(n.text || '').toLowerCase().includes(q))) return true;
    return false;
  }
  return true;
}

function buildTree(paths){
  const root = {name:'', path:'', dirs:new Map(), files:[]};
  for(const p of paths){
    const parts = p.split('/');
    const fname = parts.pop();
    let node = root;
    for(const seg of parts){
      if(!node.dirs.has(seg)){
        const child = {
          name: seg,
          path: node.path ? node.path + '/' + seg : seg,
          dirs: new Map(),
          files: []
        };
        node.dirs.set(seg, child);
      }
      node = node.dirs.get(seg);
    }
    node.files.push({name: fname, path: p});
  }
  return root;
}

function hasMatch(node){
  for(const f of node.files){ if(match(f.path)) return true; }
  for(const c of node.dirs.values()){ if(hasMatch(c)) return true; }
  return false;
}

function renderTree(){
  const box = $('#tree');
  box.innerHTML = '';

  if(!scanned.length){
    box.innerHTML =
      '<div class="empty">还没有载入资料<br><br>' +
      '点击左上角「选择资料文件夹」<br>选中存放 PDF 的目录</div>';
    return;
  }

  const forceOpen = !!query || ui.filter !== 'all';
  const tree = buildTree(scanned.map(f => f.path));

  if(!hasMatch(tree)){
    box.innerHTML = '<div class="empty">没有符合条件的文件</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  renderNode(tree, frag, 0, forceOpen);
  box.appendChild(frag);
}

function renderNode(node, parentEl, depth, forceOpen){
  const dirNames = Array.from(node.dirs.keys())
    .sort((a,b) => a.localeCompare(b, 'zh', {numeric:true}));

  for(const name of dirNames){
    const child = node.dirs.get(name);
    if(!hasMatch(child)) continue;

    const collapsed = !forceOpen && ui.collapsed.indexOf(child.path) >= 0;

    const row = document.createElement('div');
    row.className = 'node dir';
    row.style.paddingLeft = (8 + depth * 13) + 'px';
    row.innerHTML =
      '<span class="tw">' + (collapsed ? '▸' : '▾') + '</span>' +
      '<span class="tw">📁</span>' +
      '<span class="nm">' + escapeHtml(name) + '</span>';
    row.addEventListener('click', () => {
      const i = ui.collapsed.indexOf(child.path);
      if(i >= 0) ui.collapsed.splice(i,1); else ui.collapsed.push(child.path);
      saveUI();
      renderTree();
    });
    parentEl.appendChild(row);

    if(!collapsed) renderNode(child, parentEl, depth + 1, forceOpen);
  }

  const files = node.files.slice()
    .sort((a,b) => a.name.localeCompare(b.name, 'zh', {numeric:true}));

  for(const f of files){
    if(!match(f.path)) continue;
    const r = getRec(f.path);
    const st = STATUS[r.status] || STATUS.todo;

    const row = document.createElement('div');
    row.className = 'node file' + (f.path === currentPath ? ' active' : '');
    row.style.paddingLeft = (8 + depth * 13 + 12) + 'px';
    row.title = f.path;
    row.innerHTML =
      '<span class="dot" style="color:' + st.color + '">' + st.dot + '</span>' +
      '<span class="nm">' + escapeHtml(f.name) + '</span>' +
      (r.starred ? '<span class="star">★</span>' : '');
    row.addEventListener('click', () => selectFile(f.path));
    parentEl.appendChild(row);
  }
}

/* ============================== 统计 ============================== */

function renderStats(){
  const box = $('#stats');
  $('#rootName').textContent = scanned.length ? (store.rootName || '') : '';

  if(!scanned.length){
    const n = Object.keys(store.files).length;
    box.innerHTML = n
      ? '<span class="chip" style="cursor:default">本地已有 ' + n + ' 条记录</span>'
      : '';
    return;
  }

  const c = {todo:0, reading:0, done:0, skip:0};
  let starred = 0;
  for(const f of scanned){
    const r = getRec(f.path);
    c[r.status] = (c[r.status] || 0) + 1;
    if(r.starred) starred++;
  }
  const total = scanned.length;
  const pct = Math.round((c.done / total) * 100);

  const chip = (key, dotColor, label, n) =>
    '<button class="chip' + (ui.filter === key ? ' on' : '') + '" data-f="' + key + '">' +
      (dotColor ? '<i style="background:' + dotColor + '"></i>' : '') +
      label + ' <b>' + n + '</b></button>';

  box.innerHTML =
    chip('all', null, '全部', total) +
    chip('reading', STATUS.reading.color, '在读', c.reading) +
    chip('done', STATUS.done.color, '已读', c.done) +
    chip('todo', STATUS.todo.color, '未读', c.todo) +
    (c.skip ? chip('skip', STATUS.skip.color, '跳过', c.skip) : '') +
    (starred ? chip('star', '#f59e0b', '★', starred) : '') +
    '<span class="chip" style="cursor:default;opacity:.75">完成 ' + pct + '%</span>';
}

/* ============================== Markdown ============================== */

function mdInline(s){
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function mdToHtml(src){
  const lines = escapeHtml(src).split('\n');
  const out = [];
  let inList = false;
  const closeList = () => { if(inList){ out.push('</ul>'); inList = false; } };

  for(const raw of lines){
    let m;
    if(m = raw.match(/^(#{1,4})\s+(.*)$/)){
      closeList();
      const lv = Math.min(m[1].length + 2, 6);
      out.push('<h' + lv + '>' + mdInline(m[2]) + '</h' + lv + '>');
      continue;
    }
    if(m = raw.match(/^\s*[-*+]\s+(.*)$/)){
      if(!inList){ out.push('<ul>'); inList = true; }
      out.push('<li>' + mdInline(m[1]) + '</li>');
      continue;
    }
    if(m = raw.match(/^\s*&gt;\s?(.*)$/)){
      closeList();
      out.push('<blockquote>' + mdInline(m[1]) + '</blockquote>');
      continue;
    }
    if(raw.trim() === ''){ closeList(); continue; }
    closeList();
    out.push('<p>' + mdInline(raw) + '</p>');
  }
  closeList();
  return out.join('');
}

/* ============================== PDF 挂载 ============================== */

function releaseBlob(){
  if(!currentBlobUrl) return;
  const old = currentBlobUrl;
  currentBlobUrl = null;
  // 延迟释放，避免正在显示的 iframe 立刻变白
  setTimeout(()=>{ try{ URL.revokeObjectURL(old); }catch(e){} }, 8000);
}

function mountPdf(file, page){
  const wrap = $('#pdfWrap');
  if(!wrap) return;

  if(!file){
    wrap.innerHTML =
      '<div class="pdf-fallback">' +
        '<div>📄 需要重新选择一次资料文件夹，才能预览 PDF</div>' +
        '<div class="small">阅读进度和笔记已经保存在本地，不会丢失</div>' +
        '<label class="btn">重新选择文件夹' +
          '<input type="file" id="dirInput2" webkitdirectory directory multiple hidden>' +
        '</label>' +
      '</div>';
    const inp = $('#dirInput2');
    if(inp) inp.addEventListener('change', e => {
      const fl = e.target.files;
      if(fl && fl.length) handleScan(fl);
      e.target.value = '';
    });
    return;
  }

  releaseBlob();
  currentBlobUrl = URL.createObjectURL(file);
  const url = currentBlobUrl + (page > 1 ? '#page=' + page : '');
  wrap.innerHTML = '<iframe id="pdfFrame" src="' + url + '" title="PDF 预览"></iframe>';
}

function gotoPage(n){
  if(!currentBlobUrl) return;
  const frame = $('#pdfFrame');
  if(!frame) return;
  const p = Math.max(1, parseInt(n,10) || 1);
  frame.src = currentBlobUrl + '#page=' + p;
}

function renderNotes(){
  const box = $('#notesList');
  if(!box || !currentPath) return;

  const r = getRec(currentPath);

  if(!r.notes.length){
    box.innerHTML = '<div class="muted small" style="padding:6px 0">还没有笔记</div>';
    return;
  }

  const sorted = r.notes.slice().sort((a,b) => {
    const ta = a.ts || '', tb = b.ts || '';
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });

  box.innerHTML = sorted.map(n => {
    const pageTag = (n.page !== null && n.page !== undefined && n.page !== '')
      ? '<span class="note-page">p.' + escapeHtml(n.page) + '</span>' : '';

    if(n.id === editingNoteId){
      return '<div class="note" data-id="' + n.id + '">' +
        '<div class="note-meta">' + pageTag +
          '<span>' + fmtTime(n.ts) + '</span></div>' +
        '<textarea>' + escapeHtml(n.text) + '</textarea>' +
        '<div class="edit-actions">' +
          '<button class="btn sm primary" data-act="save-note">保存</button>' +
          '<button class="btn sm" data-act="cancel-note">取消</button>' +
        '</div></div>';
    }

    return '<div class="note" data-id="' + n.id + '">' +
      '<div class="note-meta">' + pageTag +
        '<span>' + fmtTime(n.ts) + '</span>' +
        '<span class="sp"></span>' +
        '<button data-act="edit-note">编辑</button>' +
        '<button data-act="del-note">删除</button>' +
      '</div>' +
      '<div class="note-body">' + mdToHtml(n.text) + '</div>' +
    '</div>';
  }).join('');

  if(editingNoteId){
    const ta = box.querySelector('.note[data-id="' + editingNoteId + '"] textarea');
    if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}

  });
}
function refreshStarUI(){
  if(!currentPath) return;
  const r = getRec(currentPath);
  const btn = document.querySelector('.star[data-act="star"]');
  if(btn){
    btn.classList.toggle('on', !!r.starred);
    btn.textContent = r.starred ? '★' : '☆';
  }
}
function refreshPageUI(){
  if(!currentPath) return;
  const r = getRec(currentPath);
  const pi = $('#pageInput');
  const ti = $('#totalInput');
  if(pi && document.activeElement !== pi) pi.value = r.page || 0;
  if(ti && document.activeElement !== ti) ti.value = r.totalPages || 0;

  const hasPct = r.totalPages > 0;
  const pct = hasPct ? Math.min(100, Math.max(0, Math.round(r.page / r.totalPages * 100))) : 0;

  let pctEl = document.querySelector('.pct');
  let barEl = document.querySelector('.mini-bar');
  if(hasPct){
    if(!pctEl){
      const row = document.querySelector('.rt-row:last-child');
      const anchor = $('#jumpBtn');
      if(row && anchor){
        pctEl = document.createElement('span');
        pctEl.className = 'pct';
        barEl = document.createElement('span');
        barEl.className = 'mini-bar';
        barEl.innerHTML = '<i></i>';
        row.insertBefore(barEl, anchor);
        row.insertBefore(pctEl, barEl);
      }
    }
    if(pctEl) pctEl.textContent = pct + '%';
    const inner = document.querySelector('.mini-bar i');
    if(inner) inner.style.width = pct + '%';
  }else{
    if(pctEl) pctEl.remove();
    if(barEl) barEl.remove();
  }
}
function refreshNotesCount(){
  const el = document.querySelector('.notes-bar .count');
  if(el && currentPath) el.textContent = getRec(currentPath).notes.length;

function renderNotice(){
  const el = $('#notice');
  const cur = new Set(scanned.map(f => f.path));

  const orphans = Object.keys(store.files).filter(p => {
    if(cur.has(p)) return false;
    const r = store.files[p];
    if(!r) return false;
    return (r.status && r.status !== 'todo') || (r.notes && r.notes.length) || r.page || r.starred;
  });

  if(!scanned.length || !orphans.length){ el.classList.add('hidden'); return; }

  el.classList.remove('hidden');
  el.innerHTML =
    '⚠ 有 <b>' + orphans.length + '</b> 条记录不在当前文件夹中（可能被移动或改名了），数据仍保留。' +
    '<button class="btn link" id="cleanOrphans">清理它们</button>' +
    '<button class="btn link" id="hideNotice">忽略</button>';

  const clean = $('#cleanOrphans');
  if(clean) clean.addEventListener('click', () => {
    if(!confirm('确定要删除这 ' + orphans.length + ' 条记录吗？不可撤销。')) return;
    for(const p of orphans) delete store.files[p];
    save(); renderAll();
    toast('已清理 ' + orphans.length + ' 条记录');
  });
  const hide = $('#hideNotice');
  if(hide) hide.addEventListener('click', () => el.classList.add('hidden'));
}

function selectFile(path){
  currentPath = path;
  editingNoteId = null;
  renderTree();
  renderDetail();
  autoPageCount(path);

  if(el) el.scrollIntoView({block:'nearest'});

function setStatus(path, st){
  if(!path || !STATUS[st]) return;
  const r = ensureRec(path);
  r.status = st;
  r.updatedAt = new Date().toISOString();
  save();
  refreshStatusUI();
  renderTree();
  renderStats();
}

function toggleStar(path){
  if(!path) return;
  const r = ensureRec(path);
  r.starred = !r.starred;
  r.updatedAt = new Date().toISOString();
  save();
  refreshStarUI();
  renderTree();
  renderStats();
}

function addNote(){
  if(!currentPath) return;
  const ta = $('#noteText');
  if(!ta) return;
  const text = ta.value.trim();
  if(!text){ toast('笔记内容为空'); return; }

  const r = ensureRec(currentPath);
  const raw = $('#notePage') ? $('#notePage').value : '';
  const np = raw === '' ? null : parseInt(raw, 10);

  r.notes.push({
    id: uid(),
    text: text,
    page: (np === null || isNaN(np)) ? null : np,
    ts: new Date().toISOString()
  });
  r.updatedAt = new Date().toISOString();
  save();

  ta.value = '';
  renderNotes();
  refreshNotesCount();
  renderTree();
  toast('已添加笔记');
}

/* ============================== 导入 / 导出 ============================== */

function exportJSON(){
  const blob = new Blob([JSON.stringify(store, null, 2)], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = '阅读进度-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('已导出 ' + Object.keys(store.files).length + ' 条记录');
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast('❌ JSON 解析失败'); return; }

    if(!data || typeof data !== 'object' || !data.files || typeof data.files !== 'object'){
      toast('❌ 文件格式不正确'); return;
    }

    const incoming = Object.keys(data.files).length;
    const replace = confirm(
      '导入 ' + incoming + ' 条记录。\n\n' +
      '「确定」= 覆盖当前全部数据\n' +
      '「取消」= 合并（较新的胜出）'
    );

    if(replace){
      store.files = data.files;
      if(data.rootName) store.rootName = data.rootName;
    }else{
      for(const [p, r] of Object.entries(data.files)){
        const cur = store.files[p];
        if(!cur || (r.updatedAt || '') > (cur.updatedAt || '')) store.files[p] = r;
      }
    }
    save(); renderAll();
    toast('✅ 导入完成');
  };
  reader.readAsText(file);
}

/* --- 详情面板事件 --- */
$('#detail').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;

  if(act === 'status'){
    setStatus(currentPath, btn.dataset.v);
  }
  else if(act === 'star'){
    toggleStar(currentPath);
  }
  else if(act === 'jump-page'){
    const pi = $('#pageInput');
    if(pi) gotoPage(pi.value);
  }
  else if(act === 'open-tab'){
    if(currentBlobUrl) window.open(currentBlobUrl, '_blank');
  }
  else if(act === 'download'){
    const f = fileMap.get(currentPath);
    if(!f) return;
    const url = URL.createObjectURL(f);
    const a = document.createElement('a');
    a.href = url; a.download = f.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }
  else if(act === 'toggle-notes'){
    ui.notesOpen = !ui.notesOpen;
    saveUI();
    const panel = $('#notesPanel');
    if(panel){
      panel.classList.toggle('open', ui.notesOpen);
      const arrow = panel.querySelector('.notes-bar .arrow');
      if(arrow) arrow.textContent = ui.notesOpen ? '▾' : '▸';
      const hint = panel.querySelector('.notes-bar .muted');
      if(hint) hint.textContent = '点击' + (ui.notesOpen ? '收起' : '展开');
    }
  }
  else if(act === 'add-note'){
    addNote();
  }
  else if(act === 'edit-note'){
    const noteEl = btn.closest('.note');
    if(noteEl){ editingNoteId = noteEl.dataset.id; renderNotes(); }
  }
  else if(act === 'cancel-note'){
    editingNoteId = null; renderNotes();
  }
  else if(act === 'del-note'){
    const noteEl = btn.closest('.note');
    if(!noteEl) return;
    const id = noteEl.dataset.id;
    const r = getRec(currentPath);
    const n = r.notes.find(x => x.id === id);
    const preview = n ? n.text.slice(0, 40) : '';
    if(!confirm('删除这条笔记？\n\n' + preview + (n && n.text.length > 40 ? '…' : ''))) return;
    const rec = ensureRec(currentPath);
    rec.notes = rec.notes.filter(x => x.id !== id);
    rec.updatedAt = new Date().toISOString();
    save();
    if(editingNoteId === id) editingNoteId = null;
    renderNotes(); refreshNotesCount();
  }
  else if(act === 'save-note'){
    const noteEl = btn.closest('.note');
    if(!noteEl) return;
    const id = noteEl.dataset.id;
    const ta = noteEl.querySelector('textarea');
    const text = ta ? ta.value.trim() : '';
    if(!text){ toast('内容不能为空'); return; }
    const rec = ensureRec(currentPath);
    const n = rec.notes.find(x => x.id === id);
    if(n){ n.text = text; n.ts = new Date().toISOString(); }
    rec.updatedAt = new Date().toISOString();
    save();
    editingNoteId = null;
    renderNotes();
  }
});

/* --- 页码变更 --- */
$('#detail').addEventListener('change', e => {
  if(!currentPath) return;
  if(e.target.id !== 'pageInput' && e.target.id !== 'totalInput') return;

  const r = ensureRec(currentPath);
  const v = parseInt(e.target.value, 10);
  const val = (isNaN(v) || v < 0) ? 0 : v;

  if(e.target.id === 'pageInput'){
    r.page = val;
    if(r.totalPages > 0 && r.page > r.totalPages) r.page = r.totalPages;
  }else{
    r.totalPages = val;
    if(r.totalPages > 0 && r.page > r.totalPages) r.page = r.totalPages;
  }
  r.updatedAt = new Date().toISOString();
  save();
  refreshPageUI();
});

/* --- 笔记框快捷键 --- */
$('#detail').addEventListener('keydown', e => {
  if(e.target.id === 'noteText' && (e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    e.preventDefault(); addNote(); return;
  }
  if(e.target.tagName === 'TEXTAREA' && e.key === 'Escape' && editingNoteId){
    e.preventDefault(); editingNoteId = null; renderNotes();

  }
});

/* --- 全局快捷键 --- */
document.addEventListener('keydown', e => {
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);

  if(!typing && e.key === '/'){ e.preventDefault(); $('#search').focus(); return; }
  if(typing) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;

  if(e.key === 'j' || e.key === 'J' || e.key === 'ArrowDown'){
    const list = scanned.filter(f => match(f.path));
    if(!list.length) return;
    e.preventDefault();
    const i = list.findIndex(f => f.path === currentPath);
    const next = list[Math.min(list.length - 1, i < 0 ? 0 : i + 1)];
    if(next) selectFile(next.path);
    return;
  }
  if(e.key === 'k' || e.key === 'K' || e.key === 'ArrowUp'){
    const list = scanned.filter(f => match(f.path));
    if(!list.length) return;
    e.preventDefault();
    const i = list.findIndex(f => f.path === currentPath);
    const prev = list[Math.max(0, i < 0 ? 0 : i - 1)];
    if(prev) selectFile(prev.path);
    return;
  }
  if(!currentPath) return;

  const idx = ['1','2','3','4'].indexOf(e.key);
  if(idx >= 0){ e.preventDefault(); setStatus(currentPath, STATUS_KEYS[idx]); return; }
  if(e.key === 's' || e.key === 'S'){ e.preventDefault(); toggleStar(currentPath); }
});

/* ============================== 启动 ============================== */

loadAll();
renderAll();

try{
  localStorage.setItem('__t','1');
  localStorage.removeItem('__t');
}catch(e){
  toast('⚠ 当前环境无法保存数据，请及时导出备份');
}

})();
</script>
